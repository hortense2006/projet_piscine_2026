<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoyageVista - Inscription réussie</title>
    <link rel="stylesheet" href="src/css/connexion.css">
</head>
<body>
    <main class="auth-page">
        <section class="intro-panel" aria-label="Bienvenue sur VoyageVista">
            <a class="brand" href="index.html" aria-label="VoyageVista">
                <span class="brand-icon">✈</span>
                <span>VoyageVista</span>
            </a>
            <div class="intro-copy">
                <p class="eyebrow">Nouveau départ</p>
                <h1>Bienvenue !</h1>
                <p>Votre compte VoyageVista vous permet de préparer vos destinations, vos séjours et vos réservations.</p>
            </div>
        </section>

        <section class="auth-shell result-shell" aria-label="Résultat de l'inscription">
            <div class="auth-card signup-card result-card">
                <div class="card-heading">
                    <p class="eyebrow">VoyageVista</p>
                    <h2>Inscription réussie !</h2>
                </div>
                <p class="result-message">Votre compte a bien été créé.</p>
                <a class="forgot-link" href="dashboard.html">Accéder au dashboard</a>
            </div>
        </section>
    </main>
</body>
</html>
